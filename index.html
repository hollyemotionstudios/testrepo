<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-content: center; justify-items: center; gap: 32px; padding: 16px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #fff; color: #111; }
    h1 { font-size: clamp(2rem, 8vw, 5rem); margin: 0; }
    /* Image placeholder: drop an <img src="..."> inside to replace the label */
    .image-placeholder { width: min(480px, 90vw); aspect-ratio: 4 / 3; display: grid; place-items: center; border: 2px dashed #bbb; border-radius: 12px; background: #f4f4f4; color: #888; overflow: hidden; }
    .image-placeholder img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <div class="image-placeholder">Image placeholder</div>
</body>
</html>
